const audioUtils={bufferToWav(buffer){const numChannels=buffer.numberOfChannels;const sampleRate=buffer.sampleRate;let result;if(numChannels===2)result=this.interleave(buffer.getChannelData(0),buffer.getChannelData(1));else result=buffer.getChannelData(0);return this.encodeWAV(result,numChannels,sampleRate);},interleave(l,r){let len=l.length+r.length;let res=new Float32Array(len);let x=0;for(let i=0;i<l.length;i++){res[x++]=l[i];res[x++]=r[i];}return res;},encodeWAV(samples,numChannels,sampleRate){const buffer=new ArrayBuffer(44+samples.length*2);const view=new DataView(buffer);const writeString=(view,offset,string)=>{for(let i=0;i<string.length;i++)view.setUint8(offset+i,string.charCodeAt(i));};writeString(view,0,'RIFF');view.setUint32(4,36+samples.length*2,true);writeString(view,8,'WAVE');writeString(view,12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numChannels,true);view.setUint32(24,sampleRate,true);view.setUint32(28,sampleRate*numChannels*2,true);view.setUint16(32,numChannels*2,true);view.setUint16(34,16,true);writeString(view,36,'data');view.setUint32(40,samples.length*2,true);let offset=44;for(let i=0;i<samples.length;i++){let s=Math.max(-1,Math.min(1,samples[i]));s=s<0?s*0x8000:s*0x7FFF;view.setInt16(offset,s,true);offset+=2;}return new Blob([view],{type:'audio/wav'});}};
const recorder={recording:false,armed:false,processor:null,left:[],right:[],previewAudio:null,toggleArm(){this.armed=!this.armed;const btn=document.getElementById('armBtn');if(this.armed){btn.classList.add('armed');btn.innerText="WAITING...";document.getElementById('rec-ui-hidden').style.display='none';}else{btn.classList.remove('armed');btn.classList.remove('recording');btn.innerText="ARM REC";}},start(){if(!this.armed)return;this.left=[];this.right=[];this.processor=engine.ctx.createScriptProcessor(4096,2,2);this.processor.connect(engine.ctx.destination);engine.master.connect(this.processor);this.processor.onaudioprocess=(e)=>{if(!this.recording)return;this.left.push(new Float32Array(e.inputBuffer.getChannelData(0)));this.right.push(new Float32Array(e.inputBuffer.getChannelData(1)));};this.recording=true;const btn=document.getElementById('armBtn');btn.classList.remove('armed');btn.classList.add('recording');btn.innerText="REC";},stop(){if(this.recording){this.recording=false;if(this.processor){this.processor.disconnect();engine.master.disconnect(this.processor);}this.finish();}},finish(){const btn=document.getElementById('armBtn');btn.classList.remove('recording');this.armed=false;btn.style.display='none';const merge=(b)=>{let l=b.reduce((a,c)=>a+c.length,0),r=new Float32Array(l),o=0;b.forEach(c=>{r.set(c,o);o+=c.length});return r;};const flatL=merge(this.left);const flatR=merge(this.right);const interleaved=audioUtils.interleave(flatL,flatR);const wavBlob=audioUtils.encodeWAV(interleaved,2,engine.ctx.sampleRate);const url=URL.createObjectURL(wavBlob);if(this.previewAudio){this.previewAudio.pause();this.previewAudio=null;}this.previewAudio=new Audio(url);this.previewAudio.onended=()=>{document.getElementById('rec-playBtn').innerText="PLAY";};document.getElementById('rec-dl').href=url;document.getElementById('rec-ui-hidden').style.display='flex';},togglePreview(){if(!this.previewAudio)return;const btn=document.getElementById('rec-playBtn');if(this.previewAudio.paus
